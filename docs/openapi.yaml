openapi: 3.1.0
info:
  title: Past Life Archive API
  version: 0.2.5
  description: PRD 2.5 assessment, result presentation, unlock, and share-asset API.
servers:
  - url: http://localhost:4000/api/v1
paths:
  /analytics/events:
    post:
      operationId: createAnalyticsEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAnalyticsEvent' }
      responses:
        '201': { description: Privacy-bounded analytics event accepted }
        '400': { $ref: '#/components/responses/ValidationError' }
  /admin/content/summary:
    get:
      operationId: getContentSummary
      responses:
        '200': { description: Content catalog counts and active version }
  /auth/archive/{resultId}:
    get:
      operationId: getArchiveDetail
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResultId' }]
      responses:
        '200':
          description: Full basic result for an archive entry owned by the signed-in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveDetail' }
        '401': { description: Authentication required }
        '403': { description: Archive entry is not owned by the signed-in user }
  /sessions:
    post:
      operationId: createSession
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        '201':
          description: Anonymous session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateSessionResponse' }
  /sessions/{sessionId}/questions/{stage}:
    get:
      operationId: getQuestion
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/Stage' }
      responses:
        '200':
          description: One of six deterministic stage questions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
  /sessions/{sessionId}/answers/{stage}:
    put:
      operationId: saveAnswer
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { $ref: '#/components/parameters/Stage' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveAnswerRequest' }
      responses:
        '200': { description: Answer saved }
        '400': { $ref: '#/components/responses/ValidationError' }
  /sessions/{sessionId}/complete:
    post:
      operationId: completeSession
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '202': { description: Result snapshot accepted }
        '409': { description: Invalid session state }
  /sessions/{sessionId}/view-mode:
    patch:
      operationId: updateViewMode
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [viewMode]
              properties: { viewMode: { $ref: '#/components/schemas/ViewMode' } }
      responses:
        '200': { description: Session viewing preference saved }
  /results/{resultId}/status:
    get:
      operationId: getResultStatus
      description: Idempotently ensures one low-quality AI representative image for the result, or stores a library fallback when generation is unavailable or fails.
      parameters: [{ $ref: '#/components/parameters/ResultId' }]
      responses:
        '200': { description: Result status }
  /sessions/{sessionId}/ads/{slot}/complete:
    post:
      operationId: completeAd
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - name: slot
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 3 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerEventId]
              properties: { providerEventId: { type: string } }
      responses:
        '201': { description: Idempotent unlock response }
        '409': { description: Ad not verified }
  /results/{resultId}/basic:
    get:
      operationId: getBasicResult
      parameters: [{ $ref: '#/components/parameters/ResultId' }]
      responses:
        '200':
          description: Seven basic result blocks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BasicResult' }
        '403': { description: UNLOCK_REQUIRED until AD 1 is verified }
  /results/{resultId}/deep:
    get:
      operationId: getDeepResult
      parameters: [{ $ref: '#/components/parameters/ResultId' }]
      responses:
        '200': { description: Four deep result blocks, content: { application/json: { schema: { $ref: '#/components/schemas/ExtendedResult' } } } }
        '403': { description: UNLOCK_REQUIRED until AD 2 is verified }
  /results/{resultId}/guide:
    get:
      operationId: getGuideResult
      parameters: [{ $ref: '#/components/parameters/ResultId' }]
      responses:
        '200': { description: Four present-life guide blocks, content: { application/json: { schema: { $ref: '#/components/schemas/ExtendedResult' } } } }
        '403': { description: UNLOCK_REQUIRED until AD 3 is verified }
  /results/{resultId}/share:
    get:
      operationId: createResultShareLink
      parameters: [{ $ref: '#/components/parameters/ResultId' }]
      responses:
        '200': { description: Stable share link, content: { application/json: { schema: { $ref: '#/components/schemas/ShareResult' } } } }
        '404': { description: Result not found }
  /results/{resultId}/share-assets:
    post:
      operationId: createShareAsset
      parameters: [{ $ref: '#/components/parameters/ResultId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, locale]
              properties:
                type: { type: string, enum: [VIDEO, IMAGE] }
                locale: { type: string, default: ko }
      responses:
        '201': { description: Stable image or video template share asset }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string } }
    ResultId: { name: resultId, in: path, required: true, schema: { type: string } }
    Stage: { name: stage, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 6 } }
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    CreateAnalyticsEvent:
      type: object
      additionalProperties: false
      required: [name, metadata]
      properties:
        name:
          type: string
          enum: [session_started, question_shown, answer_selected, questions_completed, ad_started, ad_completed, ad_failed, basic_result_viewed, view_mode_changed, deep_cta_clicked, deep_unlocked, guide_cta_clicked, guide_unlocked, image_ready, image_fallback_used, share_format_selected, share_asset_ready, share_completed, new_past_life_clicked, google_login_started, google_login_completed, archive_saved, deep_link_opened, store_redirected]
        occurredAt: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: false
          properties:
            sessionId: { type: string, format: uuid }
            resultId: { type: string, format: uuid }
            questionId: { type: string }
            choiceId: { type: string }
            contentVersion: { type: string }
            sessionStatus: { type: string }
            locale: { type: string }
            platform: { type: string, enum: [android, ios, web, unknown] }
            viewMode: { $ref: '#/components/schemas/ViewMode' }
            shareFormat: { type: string, enum: [VIDEO, IMAGE] }
            adPlacement: { type: integer, minimum: 1, maximum: 3 }
            stage: { type: integer, minimum: 1, maximum: 6 }
            imageStatus: { type: string, enum: [READY, FALLBACK] }
    CreateSessionRequest:
      type: object
      properties:
        locale: { type: string, default: ko }
        deviceId: { type: string, minLength: 8 }
        preferredViewMode: { $ref: '#/components/schemas/ViewMode' }
    CreateSessionResponse:
      type: object
      required: [sessionId, seed, contentVersion, status, viewMode]
      properties:
        sessionId: { type: string }
        seed: { type: string }
        contentVersion: { type: string, example: 2.5.0 }
        status: { type: string, example: CREATED }
        viewMode: { $ref: '#/components/schemas/ViewMode' }
    ViewMode:
      type: string
      enum: [VIDEO, TEXT]
    Question:
      type: object
      required: [id, stage, text, choices]
      properties:
        id: { type: string }
        stage: { type: integer }
        text: { type: string }
        choices:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: object
            required: [id, text, displayOrder]
            properties:
              id: { type: string }
              text: { type: string }
              displayOrder: { type: integer }
    SaveAnswerRequest:
      type: object
      required: [questionId, choiceId]
      properties:
        questionId: { type: string }
        choiceId: { type: string }
    BasicResult:
      type: object
      required: [resultId, recordNo, headline, image, blocks, disclaimer]
      properties:
        resultId: { type: string }
        recordNo: { type: integer, minimum: 1, maximum: 99 }
        headline: { type: string }
        image: { type: object }
        blocks: { type: array, minItems: 7, maxItems: 7, items: { type: object } }
        disclaimer: { type: string }
    ArchiveDetail:
      allOf:
        - { $ref: '#/components/schemas/BasicResult' }
        - type: object
          required: [viewMode]
          properties:
            viewMode: { $ref: '#/components/schemas/ViewMode' }
    ExtendedResult:
      type: object
      required: [resultId, image, blocks, disclaimer]
      properties:
        resultId: { type: string }
        image: { type: object }
        blocks: { type: array, minItems: 4, maxItems: 4, items: { type: object } }
        disclaimer: { type: string }
    ShareResult:
      type: object
      required: [resultId, shareToken, shareUrl, expiresAt]
      properties:
        resultId: { type: string }
        shareToken: { type: string, minLength: 8 }
        shareUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
